<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 40" width="206" height="40" fill="none">
  <!-- Parul University -->
  <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A" letter-spacing="-0.2px">Parul</text>
  <text x="43" y="9" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#64748B">&reg;</text>
  <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="0.2px">University</text>

  <!-- Divider -->
  <line x1="72" y1="6" x2="72" y2="34" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />

  <!-- NAAC GRADE -->
  <text x="82" y="16" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="800" fill="#0F172A" letter-spacing="0.4px">NAAC</text>
  <text x="82" y="31" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="0.6px">GRADE</text>

  <!-- Red circle with A -->
  <circle cx="145" cy="20" r="11.5" fill="#DC2626" />
  <text x="145" y="24.2" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>

  <!-- Pluses -->
  <text x="161" y="24.5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#0F172A" letter-spacing="-0.5px">++</text>
</svg>
