<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Parul University E-Club | Welcome</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader" class="preloader">
    <div class="loader-content">
      <div class="gold-ring-wrapper">
        <svg class="progress-ring" viewBox="0 0 110 110" width="100%" height="100%">
          <circle class="progress-ring-track" stroke="rgba(218, 175, 110, 0.15)" stroke-width="3" fill="transparent" r="48" cx="55" cy="55"/>
          <circle id="progressRingCircle" class="progress-ring-fill" stroke="#D4AF37" stroke-width="3" stroke-dasharray="301.59" stroke-dashoffset="301.59" stroke-linecap="round" fill="transparent" r="48" cx="55" cy="55"/>
        </svg>
        <span id="loadPercent" class="load-percent">0%</span>
      </div>
      <p class="loader-title">PARUL UNIVERSITY E-CLUB</p>
      <p class="loader-status" id="loaderStatus">Loading experience...</p>
    </div>
  </div>

  <!-- Fullscreen Video Animation Stage -->
  <section id="intro-stage" class="intro-stage">
    <canvas id="introCanvas"></canvas>
    
    <!-- Cinematic Vignette & Ambient Overlays -->
    <div class="cinematic-vignette"></div>

  </section>

  <!-- Container for the website after the animation ends -->
  <!-- Screen transitions to solid black here. You can add your website directly inside! -->
  <main id="website-container" class="website-container hidden">
    <!-- YOUR WEBSITE DIRECTLY GOES HERE -->
  </main>

  <script src="script.js"></script>
</body>
</html>
